name: Note2Exam
options:
  bundleIdPrefix: com.note2exam
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: "Note2Exam"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"
targets:
  Note2Exam:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.note2exam.app
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
